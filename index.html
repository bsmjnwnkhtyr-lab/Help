<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هوية الصور — كلية هندسة النفط والغاز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--ink:#10201f;--card:#fff;--line:#d9d5cb;--teal:#0b3b3a;--gold:#e0a526}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1514;--ink:#eef2f0;--card:#16201f;--line:#2a3837}}
:root[data-theme=dark]{--bg:#0e1514;--ink:#eef2f0;--card:#16201f;--line:#2a3837}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:760px;margin:auto}
h1{font-size:22px;font-weight:900;margin:8px 0 4px}p.s{margin:0 0 16px;opacity:.7;font-size:14px}
.pick{display:block;border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;background:var(--card);font-weight:700}
.pick input{display:none}
canvas{width:100%;height:auto;border-radius:10px;margin-top:16px;display:block;background:var(--card);border:1px solid var(--line)}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
button{flex:1;min-width:140px;font:700 16px Cairo,sans-serif;padding:13px;border-radius:12px;border:0;cursor:pointer;background:var(--teal);color:#fff}
button.g{background:var(--gold);color:#1a1405}button:disabled{opacity:.4}
button:focus-visible,.pick:focus-within{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>

const c=document.getElementById('c'),x=c.getContext('2d');
const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
let L,photo=null;
function logo(img,cx,cy,s){x.save();x.shadowColor='rgba(0,10,40,.6)';x.shadowBlur=s*.08;x.drawImage(img,cx-s/2,cy-s/2,s,s);x.restore()}
function wave(W,y,amp,fr,ph,fill,top){x.beginPath();x.moveTo(0,top);
 for(let i=0;i<=W;i+=W/60){x.lineTo(i,y+Math.sin(i/W*fr*6.283+ph)*amp+Math.sin(i/W*fr*2.2*6.283+ph*1.7)*amp*.35)}
 x.lineTo(W,top);x.closePath();x.fillStyle=fill;x.fill()}
function draw(){
 const W=photo?photo.width:1080,H=photo?photo.height:720;
 const bar=Math.min(W*.17,H*.25);c.width=W;c.height=H;
 x.fillStyle='#2a3837';x.fillRect(0,0,W,H);
 if(photo)x.drawImage(photo,0,0);else{x.fillStyle='#8aa';x.font='700 '+W*.04+'px Cairo';x.textAlign='center';x.fillText('معاينة — اختر صورة',W/2,H*.4)}
 const y=H-bar,a=bar*.09,B=H+5;
 let g=x.createLinearGradient(0,y-bar*.2,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(2,10,30,.3)');x.fillStyle=g;x.fillRect(0,y-bar*.2,W,bar*1.2);
 let w=x.createLinearGradient(0,0,W,0);
 w.addColorStop(0,'rgba(60,130,230,.28)');w.addColorStop(1,'rgba(40,90,190,.1)');wave(W,y+bar*.05,a,1.1,.4,w,B);
 w=x.createLinearGradient(0,0,W,0);w.addColorStop(0,'rgba(30,70,160,.12)');w.addColorStop(.5,'rgba(70,140,235,.34)');w.addColorStop(1,'rgba(30,70,160,.16)');wave(W,y+bar*.2,a*1.1,.9,2.1,w,B);
 w=x.createLinearGradient(0,0,W,0);w.addColorStop(0,'rgba(10,35,100,.2)');w.addColorStop(1,'rgba(15,50,130,.45)');wave(W,y+bar*.34,a,1.3,4.0,w,B);
 w=x.createLinearGradient(0,y,0,H);w.addColorStop(0,'rgba(5,18,55,.5)');w.addColorStop(1,'rgba(2,8,28,.72)');wave(W,y+bar*.48,a*.8,1,5.2,w,B);
 const s=bar*.78,cy=H-bar*.36,p=bar*.1;
 logo(L.uni,W-p-s/2,cy,s);logo(L.fac,p+s/2,cy,s);
 x.save();x.textAlign='center';x.direction='rtl';x.shadowColor='rgba(0,8,30,.8)';x.shadowBlur=bar*.08;
 x.fillStyle='#fff';x.font='900 '+bar*.17+'px Cairo';x.fillText('كلية هندسة النفط والغاز',W/2,cy-bar*.03);
 x.fillStyle='#cfe3ff';x.font='700 '+bar*.125+'px Cairo';x.fillText('جامعة الزاوية',W/2,cy+bar*.12);
 x.fillStyle='rgba(255,255,255,.8)';x.font='500 '+bar*.065+'px Cairo';x.fillText('Faculty of Oil & Gas Engineering · University of Zawia',W/2,cy+bar*.23);x.restore();
}
(async()=>{L={uni:await ld(UNI),fac:await ld(FAC)};try{await document.fonts.load('900 20px Cairo')}catch(e){}draw()})();
f.onchange=async e=>{const fl=e.target.files[0];if(!fl)return;const u=URL.createObjectURL(fl);
 let i=await ld(u);const m=2400,k=Math.min(1,m/Math.max(i.width,i.height));
 const t=document.createElement('canvas');t.width=Math.round(i.width*k);t.height=Math.round(i.height*k);t.getContext('2d').drawImage(i,0,0,t.width,t.height);
 photo=t;draw();dl.disabled=sh.disabled=false};
const blob=()=>new Promise(r=>c.toBlob(r,'image/jpeg',.92));
dl.onclick=async()=>{const b=await blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='petroleum-faculty-photo.jpg';a.click()};
sh.onclick=async()=>{const b=await blob();const file=new File([b],'photo.jpg',{type:'image/jpeg'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else dl.click()}catch(e){}};
</script></body></html>
